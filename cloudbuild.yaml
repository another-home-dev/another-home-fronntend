# CI/CD for the frontend service: test -> build -> push -> roll out to GKE.
# Triggered by pushes to main (see another-home-infra/README.md for the trigger
# setup). The Kubernetes config itself (env vars, resources, ingress) is deployed
# from the another-home-infra repo; this pipeline only changes the image.
substitutions:
  _REGION: asia-southeast1
  _CLUSTER: another-home
  _NAMESPACE: another-home
  _IMAGE: asia-southeast1-docker.pkg.dev/${PROJECT_ID}/another-home-repo/another-home-frontend
  _DEPLOYMENT: frontend
  # Baked into the bundle at build time (Asgardeo redirects back here).
  _APP_BASE_URL: https://34.54.94.62.nip.io

steps:
  # Playwright smoke tests (login page + route-guard redirects). Uses the
  # official Playwright image so Chromium is already present - no browser
  # download step needed. Only covers unauthenticated routing/auth-gating;
  # see playwright.config.js for why.
  - id: test
    name: mcr.microsoft.com/playwright:v1.63.0-jammy
    dir: frontend
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npx playwright test

  # Tag images with the commit so every deploy is traceable and can be rolled
  # back to. Manual `gcloud builds submit` runs have no commit, so they get the
  # build ID instead.
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: frontend
    entrypoint: bash
    args:
      - -ceu
      - |
        SHA="$SHORT_SHA"
        TAG="$${SHA:-manual-$BUILD_ID}"
        TAG="$${TAG:0:40}"
        echo "$$TAG" > /workspace/image-tag
        docker build --build-arg VITE_API_BASE_URL=/api/v1 --build-arg VITE_APP_BASE_URL=${_APP_BASE_URL} -t "${_IMAGE}:$$TAG" -t "${_IMAGE}:latest" .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]

  - id: deploy
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    args:
      - -ceu
      - |
        TAG=$$(cat /workspace/image-tag)
        gcloud container clusters get-credentials ${_CLUSTER} --region ${_REGION}
        kubectl -n ${_NAMESPACE} set image deployment/${_DEPLOYMENT} ${_DEPLOYMENT}="${_IMAGE}:$$TAG"
        kubectl -n ${_NAMESPACE} rollout status deployment/${_DEPLOYMENT} --timeout=5m

options:
  logging: CLOUD_LOGGING_ONLY
  # Lets _IMAGE's default refer to ${PROJECT_ID}.
  dynamicSubstitutions: true
timeout: 1800s
